name: Ali-Control Governance Validation

on:
  pull_request:
    branches:
      - main
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ali-control-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-control-document:
    name: Validate governance README
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run governance validator unit tests
        run: python -m unittest discover -s tests -p "test_governance_validation.py" -v

      - name: Validate approved governance README
        run: python scripts/validate_governance.py README.md
