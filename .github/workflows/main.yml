name: Ali-Control Governance Validation

on:
  pull_request:
    branches:
      - main
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control-document:
    name: Validate governance README
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch the approved main README without modifying main
        shell: bash
        run: |
          git fetch --no-tags origin main
          git show origin/main:README.md > README.main.md

      - name: Run the modified Python validator directly on main README
        shell: bash
        run: |
          python3 scripts/validate_governance.py README.main.md
