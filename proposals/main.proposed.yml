name: Ali-Control Governance Proposal Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "proposal/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-proposal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-proposal:
    name: Validate proposed governance files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run positive and negative validator tests
        run: python -m unittest discover -s tests -p "test_governance_validation.py" -v

      - name: Validate proposed README
        run: python scripts/validate_governance.py proposals/README.proposed.md
