name: Ali-Control Governance Validation

on:
  pull_request:
    branches:
      - main
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ali-control-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-control-document:
    name: Validate governance README
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run governance validator unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate the repository README
        run: python3 scripts/validate_governance.py README.md
